<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chassis scene</title>
<style>
  @font-face { font-family: "Plex"; src: url(fonts/IBMPlexSans-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "Plex"; src: url(fonts/IBMPlexSans-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: "Chakra"; src: url(fonts/ChakraPetch-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: "Mono"; src: url(fonts/JetBrainsMono-Medium.ttf); font-weight: 500; }
  :root { --bg: #EEF0F3; --surface: #FFFFFF; --text: #14161A; --muted: #5A606B; --accent: #FF5A1F; --line: #DCDFE5; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font: 13px/1.4 "Plex", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
  body { background: radial-gradient(120% 90% at 50% 30%, var(--surface) 0%, var(--bg) 75%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  canvas.hovering { cursor: pointer; }
  #tip { position: fixed; pointer-events: none; padding: 8px 12px 9px; border-radius: 6px; border-left: 3px solid var(--accent) !important; background: var(--surface); color: var(--text);
         border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.18); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 280px; }
  #tip.on { opacity: 1; transform: none; }
  #tip b { display: block; font: 500 11px "Mono", monospace; color: var(--accent); text-transform: uppercase; }
  #tip span { display: block; font-weight: 600; }
  #tip i { display: block; font: 500 11px "Mono", monospace; color: var(--muted); margin-top: 2px; }
  #hint { position: fixed; left: 14px; bottom: 12px; color: var(--muted); font: 500 11px "Mono", monospace; pointer-events: none; }
  #empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #empty div { text-align: center; color: var(--muted); font-size: 15px; max-width: 320px; }
  #drop { position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 8px; display: none; align-items: center; justify-content: center;
          background: color-mix(in srgb, var(--surface) 82%, transparent); pointer-events: none; }
  #drop.on { display: flex; }
  #drop div { text-align: center; font: 600 22px "Chakra", sans-serif; color: var(--text); }
  #drop span { display: block; font: 500 12px "Mono", monospace; color: var(--muted); margin-top: 6px; }
  #empty strong { display: block; color: var(--text); font: 600 22px "Chakra", sans-serif; margin-bottom: 6px; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="tip"><b></b><span></span><i></i></div>
<div id="hint">DRAG turn · SCROLL zoom · RIGHT-DRAG move · CLICK swap part</div>
<div id="drop"><div>Drop your spec list to build it<span>SCREENSHOT OR PHOTO · READ ON THIS PC</span></div></div>
<div id="empty"><div><strong>Your bench is empty</strong>Pick a case to start the build.</div></div>
<script src="three.min.js"></script>
<script src="scene.js"></script>
</body>
</html>
