name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Chassis.sln
      - name: Build
        run: dotnet build Chassis.sln -c Release --no-restore
      - name: Test
        run: dotnet test Chassis.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Screen tour - launch the real app and screenshot every page
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Couldn't change resolution: $_" }
          dotnet publish src/Chassis.App/Chassis.App.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 -p:PublishReadyToRun=true -o smoke
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen: $($b.Width)x$($b.Height)"
          $tour = Join-Path $env:RUNNER_TEMP "tour"
          New-Item -ItemType Directory -Force $tour | Out-Null
          $env:CHASSIS_TOUR = $tour
          $env:CHASSIS_TOUR_IMAGE = (Resolve-Path tests/fixtures/spec-list.png).Path
          $env:CHASSIS_SMOKE = "1"
          $p = Start-Process -FilePath smoke/Chassis.exe -PassThru
          $deadline = (Get-Date).AddSeconds(420)
          while (-not (Test-Path (Join-Path $tour "done.txt")) -and (Get-Date) -lt $deadline -and -not $p.HasExited) {
            Get-ChildItem $tour -Filter "ready-*.txt" | ForEach-Object {
              $name = $_.BaseName.Substring(6)
              $shot = Join-Path $tour "shot-$name.txt"
              if (-not (Test-Path $shot)) {
                $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
                $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $g.Dispose()
                $bmp.Save((Join-Path $tour "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
                Set-Content $shot "ok"
                Write-Host "captured $name"
              }
            }
            Start-Sleep -Milliseconds 250
          }
          $alive = -not $p.HasExited
          Write-Host "App alive at end of tour: $alive"
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $logs = Join-Path $env:LOCALAPPDATA "Chassis\logs"
          if (Test-Path $logs) { Get-ChildItem $logs | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 80 } }
          Get-ChildItem $tour -Filter *.error.txt -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "TOUR-ERROR $($_.Name)"; Get-Content $_.FullName }
          if (Test-Path (Join-Path $tour "ocr.txt")) { Write-Host "== OCR"; Get-Content (Join-Path $tour "ocr.txt") | ForEach-Object { Write-Host "OCR: $_" } }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime','Application Error','Windows Error Reporting' } |
            ForEach-Object { Write-Host "== EVENT $($_.ProviderName) $($_.Id)"; Write-Host $_.Message }
          $enc = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 72L
          Get-ChildItem $tour -Filter *.png | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $small = New-Object System.Drawing.Bitmap $img, 1440, ([int]($img.Height * 1440 / $img.Width)); $img.Dispose()
            $ms = New-Object System.IO.MemoryStream; $small.Save($ms, $enc, $ep); $small.Dispose()
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            for ($i = 0; $i -lt $b64.Length; $i += 6000) { Write-Host ("SHOT:" + $_.BaseName + ":" + $b64.Substring($i, [Math]::Min(6000, $b64.Length - $i))) }
          }
          if (Get-ChildItem $tour -Filter *.error.txt -ErrorAction SilentlyContinue) { throw "Screen tour hit errors (see TOUR-ERROR above)" }
          if (-not (Test-Path (Join-Path $tour "done.txt"))) { throw "Screen tour didn't finish (app alive: $alive)" }
      - name: Upload screen tour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-tour
          path: ${{ runner.temp }}/tour/*.png
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test cross-platform projects
        shell: bash
        run: |
          set -euo pipefail
          for p in tests/*/*.csproj; do
            echo "::group::$p"
            dotnet test "$p" -c Release
            echo "::endgroup::"
          done
