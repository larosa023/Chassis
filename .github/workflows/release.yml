name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0 or 0.2.0-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> $GITHUB_OUTPUT
          if [[ "$V" == *-* ]]; then echo "pre=--pre" >> $GITHUB_OUTPUT; else echo "pre=" >> $GITHUB_OUTPUT; fi
      - name: Test
        run: dotnet test Chassis.sln -c Release
      - name: Publish app
        run: dotnet publish src/Chassis.App/Chassis.App.csproj -c Release -r win-x64 --self-contained -p:Version=${{ steps.v.outputs.version }} -p:Platform=x64 -p:PublishReadyToRun=true -o publish
      - name: Licenses
        shell: bash
        run: cp LICENSE THIRD-PARTY-NOTICES.md publish/
      - name: Release notes
        shell: bash
        run: |
          f="docs/release-notes/${{ steps.v.outputs.version }}.md"
          if [ -f "$f" ]; then cp "$f" notes.md; else echo "Chassis ${{ steps.v.outputs.version }}" > notes.md; fi
      - name: Pack
        run: |
          dotnet tool install -g vpk --version 0.0.1298
          vpk pack -u Chassis -v ${{ steps.v.outputs.version }} -p publish -e Chassis.exe -i src/Chassis.App/Assets/chassis.ico --packTitle Chassis --packAuthors "Anthony LaRosa" --releaseNotes notes.md
      - name: Upload to GitHub Releases
        run: vpk upload github --repoUrl https://github.com/larosa023/Chassis --publish ${{ steps.v.outputs.pre }} --releaseName "Chassis ${{ steps.v.outputs.version }}" --tag v${{ steps.v.outputs.version }} --token ${{ secrets.GITHUB_TOKEN }}
